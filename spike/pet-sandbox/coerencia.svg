<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="ui-monospace, Menlo, monospace">
  <rect width="520" height="300" fill="#0b0f14"/>
  <text x="12" y="22" fill="#7dd3fc" font-size="13">Visão de cima — o que o spike mede</text>

  <!-- piso -->
  <ellipse cx="270" cy="170" rx="200" ry="95" fill="none" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="415" y="255" fill="#3f5a78" font-size="10">piso real</text>

  <!-- camera / jogador -->
  <circle cx="90" cy="245" r="9" fill="#fbbf24"/>
  <text x="66" y="272" fill="#fbbf24" font-size="11">jogador</text>

  <!-- pet -->
  <rect x="228" y="128" width="34" height="34" rx="5" fill="#4ade80"/>
  <text x="222" y="120" fill="#4ade80" font-size="11">pet</text>

  <!-- comida -->
  <circle cx="370" cy="185" r="12" fill="#f87171"/>
  <text x="344" y="215" fill="#f87171" font-size="11">comida</text>

  <!-- d1 -->
  <line x1="90" y1="245" x2="245" y2="145" stroke="#e8f0f8" stroke-width="1.2"/>
  <text x="140" y="192" fill="#e8f0f8" font-size="11">d1 câmera→pet</text>

  <!-- d2 -->
  <line x1="90" y1="245" x2="370" y2="185" stroke="#e8f0f8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="196" y="238" fill="#8fa8c0" font-size="11">d2 câmera→comida</text>

  <!-- d12 -->
  <line x1="262" y1="145" x2="358" y2="182" stroke="#c084fc" stroke-width="2.2"/>
  <text x="268" y="176" fill="#c084fc" font-size="11">distância pet↔comida</text>

  <text x="12" y="292" fill="#8fa8c0" font-size="11">O mundo inteiro pode escorregar um pouco: pet e comida escorregam juntos e ninguém nota. Se a distância entre eles muda, o spike reprova.</text>
</svg>
