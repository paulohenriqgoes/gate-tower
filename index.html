<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Babylon AR Tower Defense</title>
    <!--
      Tela cheia: no Android/Chrome vem da Fullscreen API (src/ui/screenOrientation.ts).
      No Safari do iPhone, que nao implementa a API, o unico caminho e adicionar
      o site a tela de inicio — dai valem as metas apple-mobile-web-app-*.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#090e13" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tower Gate" />
    <script src="/8thwall/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
    <!--
      Coaching overlay de escala absoluta (MIT). Guia o jogador a mover o
      celular para frente e para tras ate o SLAM convergir — sem isso da para
      ancorar a arena com a escala ainda errada. Ele se expoe sozinho em
      window.CoachingOverlay ao carregar.
    -->
    <script src="/coaching-overlay/coaching-overlay.js" async crossorigin="anonymous"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #090e13;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
      }

      /*
        Retrato e a UNICA orientacao desta demo, nos dois modos (tela e RA):
        travar em retrato remove a troca de orientacao no meio da sessao de RA,
        que e o que estica a projecao (ver ar-xr-8thwall.md). Por isso este
        aviso nao depende de classe nenhuma no body — vale sempre.

        Onde screen.orientation.lock funciona (Android/Chrome em fullscreen)
        este aviso nunca aparece, porque o SO ja nao deixa girar para paisagem.
        No iOS Safari, que nao implementa a API, este overlay CSS e a UNICA
        garantia de que o jogo fica em pe: funciona sem JS, antes mesmo da cena
        carregar.
      */
      #rotate-prompt {
        display: none;
      }

      @media (orientation: landscape) and (pointer: coarse) {
        #rotate-prompt {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 10;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          padding: 24px;
          background: #090e13;
          color: #f8fafc;
          font-family: "Trebuchet MS", ui-sans-serif, system-ui, sans-serif;
          text-align: center;
        }
      }

      #rotate-prompt .rotate-icon {
        font-size: 64px;
        animation: rotate-hint 2.4s ease-in-out infinite;
      }

      #rotate-prompt .rotate-title {
        font-size: 22px;
        font-weight: bold;
      }

      #rotate-prompt .rotate-hint {
        font-size: 15px;
        color: #a5b4fc;
        max-width: 22em;
      }

      @keyframes rotate-hint {
        0%,
        45% {
          transform: rotate(90deg);
        }
        70%,
        100% {
          transform: rotate(0deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #rotate-prompt .rotate-icon {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="rotate-prompt">
      <div class="rotate-icon">📱</div>
      <div class="rotate-title">Gire o celular</div>
      <div class="rotate-hint">O Tower Gate foi feito para ser jogado em pe (retrato).</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
